<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Flowkit canvas playground</title>
    <link rel="preconnect" href="https://rsms.me/" />
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css" />
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
      }
      body {
        font-family: "Inter", system-ui, sans-serif;
        background: #f7f7f9;
      }
      .pg {
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .pg-bar {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 16px;
        padding: 10px 16px;
        font-size: 13px;
        color: #1b1b20;
        background: #fff;
        border-bottom: 1px solid #e4e4e9;
      }
      .pg[data-theme="dark"] .pg-bar {
        color: #ededf1;
        background: #121215;
        border-color: #2c2c33;
      }
      @media (prefers-color-scheme: dark) {
        .pg[data-theme="system"] .pg-bar {
          color: #ededf1;
          background: #121215;
          border-color: #2c2c33;
        }
      }
      .pg-field {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        opacity: 0.85;
      }
      .pg-log {
        margin-left: auto;
        opacity: 0.6;
      }
      .pg-canvas {
        flex: 1;
        min-height: 0;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
