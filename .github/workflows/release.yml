# Fully automatic releases on every push to main. See docs/releasing.md.
#
#   gates           same checks as a PR (reusable gates.yml)
#   prepare         pending changesets -> `changeset version` + bot commit to main ([skip ci]);
#                   then pack every package version that isn't on npm yet
#   publish         `npm publish <tarball>` via npm trusted publishing (OIDC, no token)
#   github-release  tags (<name>@<version> + v<version>) and one GitHub Release for the fixed group
#
# Nothing to release -> prepare packs nothing, publish is skipped, github-release is a no-op.
# Every job is idempotent: re-running a failed run skips versions already on npm and existing
# tags/releases, and fast-forwards over the version commit an earlier attempt already pushed.
#
# The npm trusted publisher for each package must name this file: release.yml.
name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One release at a time, never cancelled midway. A newer push queues behind the running one.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  gates:
    # Only the upstream repo's main releases: guards workflow_dispatch on other refs, and forks
    # with Actions enabled (which would otherwise commit/tag in the fork and fail at publish).
    if: github.repository == 'jakezegil/flowline' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/gates.yml

  prepare:
    needs: gates
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the version commit
    outputs:
      status: ${{ steps.sync.outputs.status }}
      mode: ${{ steps.plan.outputs.mode }}
      sha: ${{ steps.version.outputs.sha || steps.sync.outputs.sha }}
      count: ${{ steps.pack.outputs.count || '0' }}
    steps:
      # No persisted token: install and build run without write credentials on disk. The steps
      # that fetch or push get GIT_AUTH_TOKEN, which release.mjs hands to git via env only.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: ./.github/actions/setup
        with:
          node-version: "22"
          cache: "" # no shared cache in the job that produces release artifacts

      # A re-run starts from the original commit; if an earlier attempt already pushed the
      # version commit, continue from it. If other commits landed since, a newer run owns them.
      - name: Sync with main
        id: sync
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs sync

      - name: Plan
        id: plan
        if: steps.sync.outputs.status != 'superseded'
        run: node scripts/release.mjs plan

      - name: Version packages
        id: version
        if: steps.plan.outputs.mode == 'version'
        run: node scripts/release.mjs version

      - name: Build
        if: steps.plan.outputs.mode == 'version' || steps.plan.outputs.mode == 'publish'
        run: pnpm build

      - name: Pack unpublished versions
        id: pack
        if: steps.plan.outputs.mode == 'version' || steps.plan.outputs.mode == 'publish'
        run: node scripts/release.mjs pack --out "$RUNNER_TEMP/release" --only-unpublished

      # Pushed with GITHUB_TOKEN, which doesn't trigger workflows; `[skip ci]` in the subject
      # also covers a future switch to an app/PAT token. Fails (and publishes nothing) if main
      # moved meanwhile: the newer queued run releases instead.
      - name: Push version commit
        if: steps.version.outputs.committed == 'true'
        env:
          GIT_AUTH_TOKEN: ${{ github.token }}
        run: node scripts/release.mjs push

      - uses: actions/upload-artifact@v7
        if: steps.pack.outputs.count != '' && steps.pack.outputs.count != '0'
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release
          retention-days: 7
          overwrite: true # "Re-run all jobs" uploads again under the same name
          if-no-files-found: error

  publish:
    needs: prepare
    if: needs.prepare.outputs.count != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # No dependency install here: only npm and our tarballs run with the OIDC permission.
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    outputs:
      done: ${{ steps.publish.outputs.done }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false
          sparse-checkout: scripts

      # No registry-url: nothing writes an _authToken line, so npm authenticates via OIDC.
      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # Trusted publishing needs npm >= 11.5.1 (Node 22 ships 10.x). Pinned; bump deliberately.
      - name: Install npm 11
        run: npm install -g npm@11.19.1

      - uses: actions/download-artifact@v8
        with:
          name: release-tarballs
          path: ${{ runner.temp }}/release

      - name: Publish to npm
        id: publish
        # NPM_TOKEN is an optional bootstrap-only fallback (docs/releasing.md); leave it unset.
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: node scripts/release.mjs publish --dir "$RUNNER_TEMP/release"

  github-release:
    needs: [prepare, publish]
    # Also runs when nothing was published, so a re-run heals missing tags/releases.
    if: >-
      always() && needs.prepare.result == 'success' && needs.prepare.outputs.status != 'superseded'
      && (needs.publish.result == 'success' || needs.publish.result == 'skipped')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # tags and releases
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.prepare.outputs.sha }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      # PUBLISHED is what the publish job just confirmed. The registry CDN can lag a few minutes
      # behind a publish, so those versions aren't re-checked; any others are polled uncached.
      - name: Tag and create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_AUTH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.prepare.outputs.sha }}
          PUBLISHED: ${{ needs.publish.outputs.done }}
        run: node scripts/release.mjs github-release --sha "$SHA" --published "$PUBLISHED"
