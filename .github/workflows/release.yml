# IMPORTANT: do not add the NPM_TOKEN secret until a first publish is explicitly approved.
# With no pending changesets, the first push to main after the secret exists publishes the
# current versions immediately (no "Version Packages" PR). Until then the job runs the gates
# and skips the release step.
name: Release

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency: ${{ github.workflow }}-${{ github.ref }}

permissions:
  id-token: write
  contents: write
  pull-requests: write

jobs:
  release:
    # Guards workflow_dispatch: a manual run against any other ref must not version or publish.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      HAS_NPM_TOKEN: ${{ secrets.NPM_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test

      - name: Typecheck
        run: pnpm -r typecheck

      - name: Lint
        run: pnpm lint

      # Opens/updates a "Version Packages" PR when changesets are pending, or publishes to npm
      # (via the repo's `release` script, which builds again itself) once they've been merged to
      # main. Only runs past this point once install/build/test/typecheck/lint above are green.
      - name: Create release PR or publish to npm
        # Skipped (not failed) until the NPM_TOKEN secret exists.
        if: env.HAS_NPM_TOKEN == 'true'
        uses: changesets/action@v1
        with:
          version: pnpm version-packages
          publish: pnpm release
          # TODO: once this repo is public, add `--provenance` to the `release` script's
          # `pnpm -r publish` call (npm provenance requires a public GitHub repo).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
