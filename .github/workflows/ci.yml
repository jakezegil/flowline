# Pull request checks. Pushes to main are gated (with the same reusable workflow) by release.yml,
# so they aren't run twice.
name: CI

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  gates:
    uses: ./.github/workflows/gates.yml

  changeset:
    # Advisory only: warns (annotation + job summary) instead of failing, because not every change
    # to packages/ needs a release. Use `pnpm changeset --empty` to acknowledge that explicitly.
    name: Changeset present
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Check for a changeset
        env:
          BASE_REF: ${{ github.base_ref }}
        run: node scripts/release.mjs changeset-check --base "origin/$BASE_REF"
